[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-interpretability"
version = "0.1.0"
description = "Interactive mechanistic interpretability and real-time visualization suite for Large Language Model inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Sain-Kai", email = "sohanmanna38@gmail.com"}
]
keywords = [
    "interpretability",
    "mechanistic-interpretability",
    "transformer",
    "visualization",
    "mixture-of-experts",
    "kv-cache",
    "attention",
    "deep-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
full = [
    "tiktoken>=0.7.0",
    "tokenizers>=0.19.0",
]

[project.scripts]
nebula = "nebula.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nebula*"]
